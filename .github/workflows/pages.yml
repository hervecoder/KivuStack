name: Deploy KivuStack website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site
          cp index.html _site/
          cp 404.html _site/
          cp -r assets _site/
          echo "Pages artifact contents:"
          ls -R _site
          echo "--- Verify no company docs in artifact ---"
          if ls _site/README.md 2>/dev/null; then echo "ERROR: README.md in artifact"; exit 1; fi
          if ls _site/CHANGELOG.md 2>/dev/null; then echo "ERROR: CHANGELOG.md in artifact"; exit 1; fi
          if ls _site/LICENSE 2>/dev/null; then echo "ERROR: LICENSE in artifact"; exit 1; fi
          if [ -d _site/docs ]; then echo "ERROR: docs in artifact"; exit 1; fi
          if [ -d _site/.github ]; then echo "ERROR: .github in artifact"; exit 1; fi
          echo "Artifact verification passed"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

